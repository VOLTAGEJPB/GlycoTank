AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  GlycoTank accounts and sync. Cognito handles sign-up and sign-in; an HTTP API
  (JWT-authorized) backed by one Lambda reads and writes each user's records
  in DynamoDB. Everything is scoped to the signed-in user's Cognito ID.

Parameters:
  Stage:
    Type: String
    Default: prod
  AuthDomainPrefix:
    Type: String
    Default: glycotank-auth
    Description: Prefix for the Cognito hosted sign-in domain (used by Google and Apple sign-in).
  EmailDomain:
    Type: String
    Default: ""
    Description: >
      Verified SES domain to send account emails from (e.g. glycotank.voltagejpb.com).
      Empty uses Cognito's built-in sender, which is limited to about 50 emails a day.

  # Google sign-in: an OAuth client from Google Cloud Console (Web application).
  GoogleClientId:
    Type: String
    Default: ""
  GoogleClientSecret:
    Type: String
    Default: ""
    NoEcho: true
  # Sign in with Apple: from the Apple Developer account.
  AppleServicesId:
    Type: String
    Default: ""
  AppleTeamId:
    Type: String
    Default: ""
  AppleKeyId:
    Type: String
    Default: ""
  ApplePrivateKey:
    Type: String
    Default: ""
    NoEcho: true

Conditions:
  UseSes: !Not [!Equals [!Ref EmailDomain, ""]]
  UseGoogle: !Not [!Equals [!Ref GoogleClientId, ""]]
  UseApple: !Not [!Equals [!Ref AppleServicesId, ""]]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub glycotank-${Stage}
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: false
          RequireNumbers: true
          RequireSymbols: false
      EmailConfiguration: !If
        - UseSes
        - EmailSendingAccount: DEVELOPER
          SourceArn: !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${EmailDomain}
          From: !Sub "GlycoTank <no-reply@${EmailDomain}>"
          ReplyToEmailAddress: joel.perez5588@gmail.com
        - EmailSendingAccount: COGNITO_DEFAULT
      # Used for both the sign-up code and the password reset code.
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: Your GlycoTank code
        EmailMessage: >-
          <div style="font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#1b2030">
          <p style="font-size:20px;font-weight:700;margin:0 0 16px">GlycoTank</p>
          <p style="margin:0 0 16px">Here's your code. Enter it in the app to continue.</p>
          <p style="font-size:32px;font-weight:700;letter-spacing:6px;margin:0 0 16px">{####}</p>
          <p style="color:#5b6478;font-size:14px;margin:0">If you didn't ask for this code, you can ignore this email. Someone may have typed your address by mistake.</p>
          </div>
      LambdaConfig:
        PreSignUp: !GetAtt PreSignUpFunction.Arn
      Schema:
        - Name: email
          Required: true
          Mutable: true

  # Links Google/Apple logins to the email account with the same address.
  PreSignUpFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: presignup.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:ListUsers
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminSetUserPassword
                - cognito-idp:AdminConfirmSignUp
                - cognito-idp:AdminUpdateUserAttributes
                - cognito-idp:AdminLinkProviderForUser
              # Wildcard: naming the pool here would make a circular reference.
              Resource: !Sub arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*

  PreSignUpPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PreSignUpFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  GoogleProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: UseGoogle
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: openid email profile
      AttributeMapping:
        email: email
        email_verified: email_verified

  AppleProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: UseApple
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: SignInWithApple
      ProviderType: SignInWithApple
      ProviderDetails:
        client_id: !Ref AppleServicesId
        team_id: !Ref AppleTeamId
        key_id: !Ref AppleKeyId
        private_key: !Ref ApplePrivateKey
        authorize_scopes: email
      AttributeMapping:
        email: email
        email_verified: email_verified

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Ref AuthDomainPrefix

  AppClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: glycotank-app
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 365
      TokenValidityUnits: { AccessToken: minutes, IdToken: minutes, RefreshToken: days }
      # !Ref on a provider returns its name and makes the client wait for it.
      SupportedIdentityProviders:
        - COGNITO
        - !If [UseGoogle, !Ref GoogleProvider, !Ref AWS::NoValue]
        - !If [UseApple, !Ref AppleProvider, !Ref AWS::NoValue]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs: ["glycotank://auth"]
      LogoutURLs: ["glycotank://signout"]

  DataTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub glycotank-${Stage}-data
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: userId, AttributeType: S }
        - { AttributeName: recordKey, AttributeType: S }
      KeySchema:
        - { AttributeName: userId, KeyType: HASH }
        - { AttributeName: recordKey, KeyType: RANGE }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        # API Gateway rejects custom-scheme origins (capacitor://). Auth is a bearer
        # token, not a cookie, so allowing any origin exposes nothing.
        AllowOrigins: ["*"]
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, DELETE, OPTIONS]
        MaxAge: 600
      Auth:
        DefaultAuthorizer: Cognito
        Authorizers:
          Cognito:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience: [!Ref AppClient]
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 20

  SyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handler.handler
      Environment:
        Variables:
          TABLE: !Ref DataTable
          USER_POOL_ID: !Ref UserPool
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref DataTable }
        - Statement:
            - Effect: Allow
              Action: cognito-idp:AdminDeleteUser
              Resource: !GetAtt UserPool.Arn
      Events:
        GetSync: { Type: HttpApi, Properties: { ApiId: !Ref Api, Path: /sync, Method: GET } }
        PostSync: { Type: HttpApi, Properties: { ApiId: !Ref Api, Path: /sync, Method: POST } }
        DeleteAccount: { Type: HttpApi, Properties: { ApiId: !Ref Api, Path: /account, Method: DELETE } }

Outputs:
  ApiUrl:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  UserPoolId:
    Value: !Ref UserPool
  AppClientId:
    Value: !Ref AppClient
  AuthDomain:
    Value: !Sub https://${AuthDomainPrefix}.auth.${AWS::Region}.amazoncognito.com
  Region:
    Value: !Ref AWS::Region
  Providers:
    Description: Social sign-in providers turned on, for the app config.
    Value: !Join
      - ","
      - - !If [UseApple, SignInWithApple, !Ref AWS::NoValue]
        - !If [UseGoogle, Google, !Ref AWS::NoValue]
